name: CI y verificación de Render - DenuPe IA

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: denupe-ia-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pruebas automatizadas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Comprobar sintaxis
        run: python -m compileall -q app training

      - name: Ejecutar pruebas
        run: python -m pytest -q

  render-health:
    name: Verificar servicio de pruebas en Render
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Consultar health check de Render
        env:
          RENDER_HEALTH_URL: https://denupe-ia-backend-hu-ia02-test.onrender.com/health
        run: |
          echo "Consultando: $RENDER_HEALTH_URL"
          for attempt in 1 2 3 4 5 6; do
            status=$(curl --silent --show-error --output health.json --write-out "%{http_code}" --max-time 20 "$RENDER_HEALTH_URL" || true)
            echo "Intento $attempt: HTTP $status"
            if [ "$status" = "200" ]; then
              cat health.json
              exit 0
            fi
            sleep 15
          done
          echo "::error::El servicio de pruebas de Render no respondió HTTP 200 en /health."
          [ -f health.json ] && cat health.json || true
          exit 1
