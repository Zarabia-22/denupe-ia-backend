name: Pruebas del servicio IA
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Comprobar sintaxis del backend y entrenamiento
        run: python -m compileall -q app training
      - name: Pruebas automatizadas de API, modelo y datos
        run: python -m pytest -q
