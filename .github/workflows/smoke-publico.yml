name: Verificar API pública de Render
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/smoke-publico.yml

jobs:
  comprobar-api-publica:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar salud e inferencia real por HTTPS
        shell: bash
        run: |
          python - <<'PY'
          import json, time
          from urllib.request import Request, urlopen

          base = "https://denupe-ia-backend.onrender.com"
          payload = {
              "titulo": "Basura acumulada en mi calle",
              "descripcion": "Hay bolsas de basura y residuos que no han sido recogidos durante varios dias",
          }
          for attempt in range(1, 16):
              try:
                  with urlopen(base + "/health", timeout=35) as r:
                      health = json.load(r)
                  assert health["status"] == "ok", health
                  req = Request(
                      base + "/api/ia/sugerir-categoria",
                      data=json.dumps(payload).encode(),
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  with urlopen(req, timeout=35) as r:
                      result = json.load(r)
                  assert result["sugerida"] is True, result
                  assert result["categoria"] == "Limpieza", result
                  print("Servicio público operativo:", base, "predicción:", result["categoria"])
                  break
              except Exception as exc:
                  print(f"Intento {attempt}/15: {exc}")
                  if attempt == 15:
                      raise
                  time.sleep(8)
          PY
