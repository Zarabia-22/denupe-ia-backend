name: Auditoría territorial nacional en Render

on:
  pull_request:
    branches:
      - develop
    paths:
      - "app/**"
      - "scripts/auditoria_territorial_real.py"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/auditoria-territorial-real.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-unitarias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Ejecutar pruebas unitarias
        run: python -m pytest -q

  auditoria-render:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DENUPE_BACKEND_TIMEOUT_SECONDS: "15"
      AUDIT_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Consultar matriz real de los UBIGEO distritales
        run: python -m scripts.auditoria_territorial_real
      - name: Publicar informe JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-territorial-render
          path: artifacts/auditoria-territorial-real.json
          if-no-files-found: warn
          retention-days: 30
